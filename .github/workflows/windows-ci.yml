name: Windows CI
on: [push, pull_request]
jobs:
  test-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: pytest
        run: python -m pytest -v
      - name: compileall
        run: python -m compileall -q app tests
      - name: Build portable package
        shell: pwsh
        run: |
          $buildPython = (Get-Command python).Source
          & .\Build-Portable.bat $buildPython
          if ($LASTEXITCODE -ne 0) { throw "Portable build failed" }
      - name: Source launcher clean bootstrap, Unicode path, and offline repeat
        shell: pwsh
        run: |
          $target = "C:\CI Work\Тест MANGO\Mango Downloader"
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $target -ItemType Directory -Force | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\*" $target -Recurse -Force
          Remove-Item "$target\runtime", "$target\.launcher", "$target\data", "$target\logs", "$target\downloads" -Recurse -Force -ErrorAction SilentlyContinue
          $env:CI = "true"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          if (Get-Command python -ErrorAction SilentlyContinue) { throw "System Python remains available" }
          & "$target\Start.bat" --smoke
          if ($LASTEXITCODE -ne 0) { throw "Clean source Start.bat smoke failed" }
          $state = Get-Item "$target\runtime\install-state.json"
          $beforeHash = (Get-FileHash $state).Hash; $beforeWrite = $state.LastWriteTimeUtc
          $env:HTTP_PROXY = "http://127.0.0.1:9"; $env:HTTPS_PROXY = "http://127.0.0.1:9"
          & "$target\Start.bat" --smoke
          if ($LASTEXITCODE -ne 0) { throw "Offline repeat Start.bat smoke failed" }
          $state = Get-Item "$target\runtime\install-state.json"
          if ((Get-FileHash $state).Hash -ne $beforeHash -or $state.LastWriteTimeUtc -ne $beforeWrite) { throw "Valid runtime state was rewritten" }
      - name: Validate portable ZIP
        shell: pwsh
        run: |
          if (!(Test-Path dist/MangoDownloader)) { throw "Portable directory missing" }
          if (!(Test-Path dist/MangoDownloader-portable.zip)) { throw "Portable ZIP missing" }
          $required = "Start.bat", "app", "runtime", "scripts", "requirements", "data", "logs", "downloads", "README.txt"
          foreach ($item in $required) {
            if (!(Test-Path (Join-Path dist/MangoDownloader $item))) { throw "Portable item missing: $item" }
          }
          if (!(Select-String -Quiet -SimpleMatch "bootstrap.ps1" dist/MangoDownloader/Start.bat)) {
            throw "Start.bat does not use the public bootstrap"
          }
      - name: Expand portable ZIP
        shell: pwsh
        run: |
          Remove-Item dist/smoke -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive dist/MangoDownloader-portable.zip dist/smoke
      - name: Test prebuilt ZIP through public launcher
        shell: pwsh
        run: |
          $env:CI = "true"
          & dist/smoke/Start.bat --smoke
          if ($LASTEXITCODE -ne 0) { throw "Prebuilt public launcher smoke-test failed" }
